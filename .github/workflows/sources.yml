# Her sabah 07:00'de (Türkiye) piyasa fiyatlarını günceller.
# Gerekli GitHub secrets: DATABASE_URL (libsql://...turso.io), DATABASE_AUTH_TOKEN
name: Günlük fiyat güncelleme

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
